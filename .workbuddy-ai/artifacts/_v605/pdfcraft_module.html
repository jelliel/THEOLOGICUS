<style id="v605-pdfcraft-css">
/* ═══ v605/v606 — PDFCraft : onglet + atelier + visionneuse pdf.js ═══
   Thémé par les jetons (suit les 10 thèmes v602). Fluide : transitions
   160 ms, désactivées sous prefers-reduced-motion. Accessible : dialog
   aria-modal, aria-expanded sur l'onglet, Escape coordonné, focus géré.
   v606 : rendu + vignettes + recherche par pdf.js (embarqué). */
#pdfcraft-panel{
  position:fixed; right:16px; top:64px; bottom:16px; z-index:var(--z-panel,199);
  width:min(430px, calc(100vw - 32px));
  display:flex; flex-direction:column;
  background:var(--bg-hull,#0d1626); color:var(--text,#d5e2f3);
  border:1px solid var(--wire,rgba(79,142,247,.2)); border-radius:12px;
  box-shadow:0 18px 60px rgba(0,0,0,.45);
  opacity:0; transform:translateY(8px); pointer-events:none;
  transition:opacity .16s ease, transform .16s ease;
}
#pdfcraft-panel.ouvert{ opacity:1; transform:translateY(0); pointer-events:auto; }
#pdfcraft-panel .pfc-tete{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  border-bottom:1px solid var(--wire,rgba(79,142,247,.2)); flex:0 0 auto;
}
#pdfcraft-panel .pfc-titre{ font-weight:600; font-size:13px; letter-spacing:.5px; flex:1; }
#pdfcraft-panel .pfc-fermer{ background:none; border:none; color:var(--text-dim,#8fa3b8);
  font-size:16px; cursor:pointer; padding:4px 8px; border-radius:6px; }
#pdfcraft-panel .pfc-fermer:hover{ color:var(--text); background:var(--bg-card-alt,rgba(255,255,255,.05)); }
#pdfcraft-panel .pfc-outils{ display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px; border-bottom:1px solid var(--wire,rgba(79,142,247,.15)); flex:0 0 auto; }
#pdfcraft-panel .pfc-btn{
  font-family:inherit; font-size:11px; padding:6px 10px; border-radius:6px; cursor:pointer;
  background:var(--bg-card-alt,rgba(255,255,255,.05)); color:var(--text);
  border:1px solid var(--wire,rgba(79,142,247,.25)); transition:background .12s ease, border-color .12s ease;
}
#pdfcraft-panel .pfc-btn:hover{ border-color:var(--accent); }
#pdfcraft-panel .pfc-btn:disabled{ opacity:.45; cursor:not-allowed; }
#pdfcraft-panel .pfc-btn.pfc-primaire{ background:var(--accent); color:var(--bg-hull,#0d1626); border-color:var(--accent); font-weight:700; }
#pdfcraft-panel .pfc-btn.pfc-primaire:hover{ filter:brightness(1.08); }
#pdfcraft-panel .pfc-liste{ flex:1 1 auto; overflow:auto; padding:6px 8px; }
#pdfcraft-panel .pfc-page{
  display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:8px;
  border:1px solid transparent;
}
#pdfcraft-panel .pfc-page:hover{ background:var(--bg-card-alt,rgba(255,255,255,.04)); }
#pdfcraft-panel .pfc-page input[type=checkbox]{ accent-color:var(--accent); width:14px; height:14px; cursor:pointer; flex:0 0 auto; }
#pdfcraft-panel .pfc-vignette{ flex:0 0 auto; background:#ffffff; border:1px solid var(--wire,rgba(79,142,247,.3)); border-radius:2px; }
#pdfcraft-panel .pfc-page .pfc-nom{ flex:1; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#pdfcraft-panel .pfc-page .pfc-nom small{ color:var(--text-dim,#8fa3b8); }
#pdfcraft-panel .pfc-page button{
  background:none; border:1px solid transparent; color:var(--text-dim,#8fa3b8);
  font-size:12px; cursor:pointer; border-radius:5px; padding:2px 5px; line-height:1.4;
}
#pdfcraft-panel .pfc-page button:hover{ color:var(--text); border-color:var(--wire,rgba(79,142,247,.3)); }
#pdfcraft-panel .pfc-page button:disabled{ opacity:.3; cursor:not-allowed; }
#pdfcraft-panel .pfc-statut{ padding:8px 12px; font-size:11px; color:var(--text-dim,#8fa3b8);
  border-top:1px solid var(--wire,rgba(79,142,247,.15)); flex:0 0 auto; }
#pdfcraft-panel .pfc-vide{ padding:22px 16px; font-size:12px; color:var(--text-dim,#8fa3b8); text-align:center; line-height:1.7; }
#open-pdfcraft{ padding-left:5px; padding-right:5px; font-size:14px; letter-spacing:0; }

/* ── Visionneuse pdf.js (rendu canvas propre à l'app — marche aussi sur Android) ── */
#pdfcraft-vue{
  position:fixed; inset:0; z-index:var(--z-modal-lg,2000);
  display:none; flex-direction:column;
  background:var(--bg-void,#0a0e17);
}
#pdfcraft-vue.ouvert{ display:flex; }
#pdfcraft-vue .pfcv-tete{
  display:flex; align-items:center; gap:10px; padding:8px 14px; flex:0 0 auto;
  background:var(--bg-hull,#0d1626); color:var(--text,#d5e2f3);
  border-bottom:1px solid var(--wire,rgba(79,142,247,.2));
}
#pdfcraft-vue .pfcv-titre{ flex:1; font-size:13px; font-weight:600; }
#pdfcraft-vue .pfcv-corps{ flex:1 1 auto; overflow:auto; display:grid; place-items:center; padding:10px; }
#pdfcraft-vue canvas{ background:#ffffff; box-shadow:0 6px 30px rgba(0,0,0,.4); max-width:none; }
#pdfcraft-vue .pfcv-barre{
  display:flex; align-items:center; gap:6px; padding:8px 14px; flex:0 0 auto; flex-wrap:wrap;
  background:var(--bg-hull,#0d1626); color:var(--text,#d5e2f3);
  border-top:1px solid var(--wire,rgba(79,142,247,.2));
}
#pdfcraft-vue .pfcv-btn{
  font-family:inherit; font-size:11px; padding:5px 9px; border-radius:6px; cursor:pointer;
  background:var(--bg-card-alt,rgba(255,255,255,.05)); color:var(--text);
  border:1px solid var(--wire,rgba(79,142,247,.25));
}
#pdfcraft-vue .pfcv-btn:hover{ border-color:var(--accent); }
#pdfcraft-vue .pfcv-btn:disabled{ opacity:.4; cursor:not-allowed; }
#pdfcraft-vue .pfcv-recherche{ display:flex; gap:4px; align-items:center; }
#pdfcraft-vue .pfcv-recherche input{
  font-family:inherit; font-size:11px; padding:5px 8px; border-radius:6px; width:130px;
  background:var(--bg-card-alt,rgba(255,255,255,.05)); color:var(--text);
  border:1px solid var(--wire,rgba(79,142,247,.25));
}
#pdfcraft-vue .pfcv-resultats{
  max-height:150px; overflow:auto; font-size:11px;
  background:var(--bg-card,#0d1626); border:1px solid var(--wire,rgba(79,142,247,.25)); border-radius:8px;
  padding:4px; position:absolute; bottom:52px; left:14px; right:14px; z-index:10;
}
#pdfcraft-vue .pfcv-resultats button{
  display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
  font-family:inherit; font-size:11px; padding:5px 6px; cursor:pointer; border-radius:5px;
}
#pdfcraft-vue .pfcv-resultats button:hover{ background:var(--bg-card-alt,rgba(255,255,255,.06)); }
#pdfcraft-vue .pfcv-motdepasse{ display:flex; gap:6px; align-items:center; padding:6px 14px; flex:0 0 auto; }
#pdfcraft-vue .pfcv-motdepasse input{
  font-family:inherit; font-size:12px; padding:5px 8px; border-radius:6px; flex:1;
  background:var(--bg-card-alt,rgba(255,255,255,.05)); color:var(--text);
  border:1px solid var(--accent);
}
#pdfcraft-vue .pfcv-pages{ display:flex; gap:12px; align-items:center; justify-content:center; }
#pdfcraft-vue .pfcv-pages canvas{ box-shadow:0 6px 30px rgba(0,0,0,.4); }
#pdfcraft-vue .pfcv-btn.actif{ background:var(--accent); color:var(--bg-hull,#0d1626); border-color:var(--accent); font-weight:700; }
#pdfcraft-vue .pfc-fermer{ background:none; border:none; color:var(--text-dim,#8fa3b8);
  font-size:16px; cursor:pointer; padding:4px 8px; border-radius:6px; }
#pdfcraft-vue .pfc-fermer:hover{ color:var(--text); background:var(--bg-card-alt,rgba(255,255,255,.05)); }
#pfc-formulaires{ flex:0 0 auto; border-top:1px solid var(--wire,rgba(79,142,247,.15));
  max-height:40%; overflow:auto; padding:4px 8px; }
#pfc-formulaires .pfc-form{ margin:4px 0; border:1px solid var(--wire,rgba(79,142,247,.2)); border-radius:8px; padding:4px 6px; }
#pfc-formulaires .pfc-form-tete{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:2px 0; }
#pfc-formulaires .pfc-form-tete span{ flex:1; }
#pfc-formulaires .pfc-champ{ display:flex; align-items:center; gap:6px; padding:3px 0; }
#pfc-formulaires .pfc-champ-nom{ flex:0 0 34%; font-size:10.5px; color:var(--text-dim,#8fa3b8); overflow:hidden; text-overflow:ellipsis; }
#pfc-formulaires .pfc-champ input[type=text], #pfc-formulaires .pfc-champ select{
  flex:1; font-family:inherit; font-size:11px; padding:4px 6px; border-radius:5px;
  background:var(--bg-card-alt,rgba(255,255,255,.05)); color:var(--text);
  border:1px solid var(--wire,rgba(79,142,247,.25)); }
#pfc-formulaires .pfc-champ input[type=checkbox]{ accent-color:var(--accent); }
#pdfcraft-vue.mesure canvas{ cursor:crosshair; }
@media (prefers-reduced-motion: reduce){
  #pdfcraft-panel{ transition:none; }
}
</style>
<script id="v605-pdfcraft">
/* ═══ v605/v606 — PDFCRAFT : onglet header + atelier + visionneuse pdf.js ═══
   Inspiré de PdfCraft (storytold/pdfcraft, Rust — app native non
   embarquable) : panneau hors-ligne via pdf-lib (bloc v605-pdflib) et
   rendu/recherche/mot de passe via pdf.js (blocs v606-pdfjs + worker
   embarqué en text/plain, worker créé par blob URL — fichier unique).

   Conformité à la bande (v597/v598) : onglet <button class="hud-btn">
   APPENDU EN FIN de .header-controls — ne déplace aucun contrôle, repris
   par le menu « Plus ». Accessibilité (v508) : dialog + aria-modal +
   aria-label, Escape coordonné (aperçu AVANT panneau), focus géré. */
(function(){
  'use strict';
  var pc = { docs: [], pages: [] };   /* docs[i]={name,doc,pjs}; pages[j]={d:docIdx,p:pageIdx,rot} */
  /* v607 — historique d'annulation (instantanés JSON du modèle de pages,
     ~150 o/page : bon marché) + mode DEUX PAGES de la visionneuse. */
  var _histo = [], _histoIdx = -1;
  function pousserHistoire() {
    var capture = JSON.stringify(pc.pages);
    if (_histoIdx >= 0 && _histo[_histoIdx] === capture) return;
    _histo = _histo.slice(0, _histoIdx + 1);
    _histo.push(capture);
    if (_histo.length > 60) { _histo.shift(); }
    _histoIdx = _histo.length - 1;
  }
  function restaurerHistoire(idx) {
    _histoIdx = idx;
    pc.pages = JSON.parse(_histo[_histoIdx]);
    rendre();
  }
  function annuler() {
    if (_histoIdx <= 0) { toast('Rien à annuler', 'info'); return; }
    restaurerHistoire(_histoIdx - 1);
  }
  function retablir() {
    if (_histoIdx >= _histo.length - 1) { toast('Rien à rétablir', 'info'); return; }
    restaurerHistoire(_histoIdx + 1);
  }

  function h(tag, attrs, texte) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') el.textContent = attrs[k];
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k]);
    });
    if (texte) el.textContent = texte;
    return el;
  }

  /* ── pdf.js : worker depuis la source embarquée (fichier unique, hors-ligne) ── */
  var _pdfJsPret = false;
  function amorcerPdfJs() {
    if (_pdfJsPret || !window.pdfjsLib) return;
    try {
      var source = document.getElementById('v606-worker-src');
      if (!source) return;
      var url = URL.createObjectURL(new Blob([source.textContent], { type: 'application/javascript' }));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = url;
      _pdfJsPret = true;
    } catch (e) {}
  }
  /* Ouvre un document via pdf.js (rendu/recherche), avec mot de passe si chiffré. */
  async function ouvrirAvecPdfJs(octets) {
    amorcerPdfJs();
    if (!window.pdfjsLib) return null;
    var motDePasse = '';
    for (var essai = 0; essai < 3; essai++) {
      try {
        var charge = window.pdfjsLib.getDocument({ data: octets.slice(), password: motDePasse });
        return await charge.promise;
      } catch (e) {
        if (e && e.name === 'PasswordException') {
          motDePasse = window.prompt('PDF chiffré — mot de passe ?') || '';
          continue;
        }
        throw e;
      }
    }
    return null;
  }

  /* ── Onglet dans la bande de contrôles ── */
  function poserOnglet() {
    var bande = document.querySelector('.header-controls');
    if (!bande || document.getElementById('open-pdfcraft')) return;
    var onglet = h('button', {
      'class': 'hud-btn', id: 'open-pdfcraft', type: 'button',
      title: "PDFCraft — atelier PDF hors-ligne : ouvrir, visualiser, réordonner, tourner, extraire, rechercher et combiner des pages",
      'aria-label': 'PDFCraft — atelier PDF',
      'aria-haspopup': 'dialog', 'aria-controls': 'pdfcraft-panel', 'aria-expanded': 'false'
    });
    /* v605b — onglet ICÔNE compact : à 1920 px la bande est pleine à ~70 px
       près (mesuré) ; un onglet textuel ferait déborder la bande et déclencher
       le fondu v597. L'icône + title + aria-label tiennent en ~26 px. */
    onglet.textContent = '📄';
    onglet.addEventListener('click', basculer);
    bande.appendChild(onglet);
  }

  /* ── Panneau ── */
  var el = {};
  function poserPanneau() {
    if (document.getElementById('pdfcraft-panel')) return;
    var p = h('div', { id: 'pdfcraft-panel', role: 'dialog', 'aria-modal': 'true',
                       'aria-label': 'PDFCraft — atelier PDF' });
    var tete = h('div', { 'class': 'pfc-tete' });
    tete.appendChild(h('span', { 'class': 'pfc-titre', text: '📄 PDFCRAFT — atelier PDF' }));
    el.fermer = h('button', { 'class': 'pfc-fermer', type: 'button',
      'aria-label': 'Fermer PDFCraft' });
    el.fermer.textContent = '✕';
    el.fermer.addEventListener('click', fermer);
    tete.appendChild(el.fermer);
    p.appendChild(tete);

    var outils = h('div', { 'class': 'pfc-outils' });
    el.fichier = h('input', { type: 'file', accept: 'application/pdf,.pdf', multiple: '' });
    el.fichier.style.display = 'none';
    el.fichier.addEventListener('change', function () { ouvrirFichiers(Array.from(el.fichier.files || [])); el.fichier.value = ''; });
    var ouvrir = h('button', { 'class': 'pfc-btn', type: 'button', text: '📂 Ouvrir des PDF' });
    ouvrir.addEventListener('click', function () { el.fichier.click(); });
    outils.appendChild(ouvrir);
    el.annuler = h('button', { 'class': 'pfc-btn', id: 'pfc-annuler', type: 'button',
      text: '⤶ Annuler', title: 'Annuler la dernière opération sur les pages (Ctrl+Z)' });
    el.annuler.addEventListener('click', annuler);
    outils.appendChild(el.annuler);
    el.retablir = h('button', { 'class': 'pfc-btn', id: 'pfc-retablir', type: 'button',
      text: '⤷ Rétablir', title: 'Rétablir (Ctrl+Y)' });
    el.retablir.addEventListener('click', retablir);
    outils.appendChild(el.retablir);
    el.voir = h('button', { 'class': 'pfc-btn', id: 'pfc-voir', type: 'button', text: '👁 Voir' });
    el.voir.addEventListener('click', voirResultat);
    outils.appendChild(el.voir);
    el.extraire = h('button', { 'class': 'pfc-btn', id: 'pfc-extraire', type: 'button', text: '✂ Extraire la sélection' });
    el.extraire.addEventListener('click', extraireSelection);
    outils.appendChild(el.extraire);
    el.texte = h('button', { 'class': 'pfc-btn', id: 'pfc-texte', type: 'button', text: '📝 Texte' });
    el.texte.addEventListener('click', extraireTexte);
    outils.appendChild(el.texte);
    el.enregistrer = h('button', { 'class': 'pfc-btn pfc-primaire', id: 'pfc-enregistrer', type: 'button', text: '💾 Enregistrer le PDF' });
    el.enregistrer.addEventListener('click', enregistrer);
    outils.appendChild(el.enregistrer);
    p.appendChild(el.fichier);
    p.appendChild(outils);

    el.liste = h('div', { 'class': 'pfc-liste', role: 'list' });
    p.appendChild(el.liste);
    /* v608 — section FORMULAIRES (visible seulement si un doc en a un) */
    el.formulaires = h('div', { id: 'pfc-formulaires' });
    el.formulaires.style.display = 'none';
    p.appendChild(el.formulaires);
    el.statut = h('div', { 'class': 'pfc-statut', 'aria-live': 'polite', text: 'Aucun document ouvert.' });
    p.appendChild(el.statut);

    document.body.appendChild(p);
    el.panneau = p;
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      /* v605c — la VISIONNEUSE passe avant : Escape la ferme SANS fermer le
         panneau resté ouvert dessous. */
      if (el.vue && el.vue.classList.contains('ouvert')) { fermerVue(); return; }
      if (el.panneau.classList.contains('ouvert')) fermer();
    });
    document.addEventListener('keydown', function (e) {
      /* v607 — annuler/rétablir au clavier, actifs quand l'atelier est ouvert. */
      if (!el.panneau || !el.panneau.classList.contains('ouvert')) return;
      var touche = (e.key || '').toLowerCase();
      if ((e.ctrlKey || e.metaKey) && touche === 'z' && !e.shiftKey) { e.preventDefault(); annuler(); }
      else if ((e.ctrlKey || e.metaKey) && (touche === 'y' || (touche === 'z' && e.shiftKey))) { e.preventDefault(); retablir(); }
    });
  }

  function basculer() {
    if (el.panneau && el.panneau.classList.contains('ouvert')) fermer();
    else ouvrir();
  }
  function ouvrir() {
    poserPanneau();
    el._focusAvant = document.activeElement;
    el.panneau.classList.add('ouvert');
    var onglet = document.getElementById('open-pdfcraft');
    if (onglet) onglet.setAttribute('aria-expanded', 'true');
    el.fermer.focus();
    if (!pc.pages.length) el.statut.textContent = 'Aucun document ouvert. Cliquez « Ouvrir des PDF ».';
  }
  function fermer() {
    if (!el.panneau) return;
    el.panneau.classList.remove('ouvert');
    var onglet = document.getElementById('open-pdfcraft');
    if (onglet) onglet.setAttribute('aria-expanded', 'false');
    if (el._focusAvant && el._focusAvant.focus) el._focusAvant.focus();
  }

  /* ── Ouverture des fichiers ── */
  async function ouvrirFichiers(files) {
    if (!window.PDFLib) { toast('Bibliothèque PDF absente — rechargement requis', 'error'); return; }
    var ajoutes = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try {
        var octets = new Uint8Array(await f.arrayBuffer());
        var doc = await PDFLib.PDFDocument.load(octets, { ignoreEncryption: true });
        var d = { name: f.name.replace(/\.pdf$/i, ''), doc: doc, pjs: null, champs: [] };
        /* v608 — champs de formulaire (AcroForm) via pdf-lib */
        try { d.form = doc.getForm(); d.champs = d.form.getFields() || []; } catch (e) { d.champs = []; }
        /* pdf.js : rendu + recherche — une COPIE des octets (pdf.js transfère
           le buffer au worker et détache l'original). Chiffré -> mot de passe. */
        try { d.pjs = await ouvrirAvecPdfJs(octets); } catch (e) { d.pjs = null; }
        pc.docs.push(d);
        for (var p = 0; p < doc.getPageCount(); p++) pc.pages.push({ d: pc.docs.length - 1, p: p, rot: 0 });
        ajoutes++;
      } catch (e) {
        toast('PDF illisible : ' + f.name, 'error');
      }
    }
    if (ajoutes) toast(ajoutes + ' document(s) ouvert(s)', 'success');
    pousserHistoire();
    rendre();
    rendreFormulaires();
  }

  /* ── Rendu de la liste (avec vignettes pdf.js paresseuses) ── */
  function rendre() {
    el.liste.textContent = '';
    if (!pc.pages.length) {
      el.liste.appendChild(h('div', { 'class': 'pfc-vide',
        text: 'Aucune page. Ouvrez un ou plusieurs PDF — leurs pages apparaissent ici avec vignettes, prêtes à être réordonnées, tournées, supprimées, extraites ou enregistrées.' }));
      majStatut();
      return;
    }
    pc.pages.forEach(function (pg, i) {
      var nom = (pc.docs[pg.d] && pc.docs[pg.d].name) || 'doc';
      var ligne = h('div', { 'class': 'pfc-page', role: 'listitem' });
      var vignette = h('canvas', { 'class': 'pfc-vignette', width: '40', height: '52',
        'aria-label': 'Vignette ' + nom + ' page ' + (pg.p + 1) });
      vignette.__pg = { d: pg.d, p: pg.p };
      ligne.appendChild(vignette);
      var coche = h('input', { type: 'checkbox', 'aria-label': 'Sélectionner ' + nom + ' page ' + (pg.p + 1) });
      coche.dataset.idx = String(i);
      ligne.appendChild(coche);
      var nomEl = h('span', { 'class': 'pfc-nom' });
      nomEl.textContent = nom + ' ';
      var petit = h('small', { text: 'p.' + (pg.p + 1) + (pg.rot ? ' · ' + pg.rot + '°' : '') });
      nomEl.appendChild(petit);
      ligne.appendChild(nomEl);
      ligne.appendChild(h('button', { type: 'button', title: 'Monter', 'aria-label': 'Monter la page', disabled: i === 0 ? '' : null }, '↑'));
      ligne.lastChild.addEventListener('click', function () { deplacer(i, -1); });
      ligne.appendChild(h('button', { type: 'button', title: 'Descendre', 'aria-label': 'Descendre la page', disabled: i === pc.pages.length - 1 ? '' : null }, '↓'));
      ligne.lastChild.addEventListener('click', function () { deplacer(i, 1); });
      ligne.appendChild(h('button', { type: 'button', title: 'Tourner à gauche', 'aria-label': 'Tourner la page à gauche' }, '↺'));
      ligne.lastChild.addEventListener('click', function () { tourner(i, -90); });
      ligne.appendChild(h('button', { type: 'button', title: 'Tourner à droite', 'aria-label': 'Tourner la page à droite' }, '↻'));
      ligne.lastChild.addEventListener('click', function () { tourner(i, 90); });

      el.vueCompte.textContent = 'rendu impossible : ' + (e && e.message || e);
    }
  }
  /* Recherche : texte de CHAQUE page du modèle (pdf.js), résultats navigables. */
  async function chercher(terme) {
    terme = (terme || '').trim();
    if (!terme) { el.vueResultats.style.display = 'none'; return; }
    amorcerPdfJs();
    el.vueResultats.textContent = '';
    el.vueResultats.style.display = 'block';
    el.vueResultats.textContent = 'Recherche…';
    var resultats = [];
    var termeN = terme.toLowerCase();
    for (var i = 0; i < pc.pages.length; i++) {
      var pg = pc.pages[i];
      var d = pc.docs[pg.d];
      if (!d || !d.pjs) continue;
      try {
        var page = await d.pjs.getPage(pg.p + 1);
        var contenu = await page.getTextContent();
        var texte = contenu.items.map(function (it) { return it.str; }).join(' ').replace(/\s+/g, ' ');
        var pos = texte.toLowerCase().indexOf(termeN);
        if (pos >= 0) {
          var debut = Math.max(0, pos - 30);
          resultats.push({ idx: i, extrait: texte.slice(debut, pos + terme.length + 40) });
        }
      } catch (e) {}
    }
    el.vueResultats.textContent = '';
    if (!resultats.length) {
      el.vueResultats.textContent = 'Aucun résultat pour « ' + terme + ' ».';
      return;
    }
    resultats.forEach(function (r) {
      var b = h('button', { type: 'button', role: 'option',
        text: 'p.' + (r.idx + 1) + ' — …' + r.extrait + '…' });
      b.addEventListener('click', function () {
        el.vueIdx = r.idx;
        el.vueResultats.style.display = 'none';
        rendreVue();
      });
      el.vueResultats.appendChild(b);
    });
  }

  /* ── Impression : rendu pdf.js de chaque page -> images -> iframe print. ──
     Événement « pdfcraft-impression » émis AVANT print() : les bancs
     l'interceptent (window.print est un no-op en headless). */
  async function imprimerTout() {
    if (!pc.pages.length) { toast('Aucune page à imprimer', 'info'); return; }
    amorcerPdfJs();
    toast('Préparation de l’impression…', 'info');
    var imgs = [];
    for (var i = 0; i < pc.pages.length; i++) {
      var pg = pc.pages[i];
      var d = pc.docs[pg.d];
      if (!d || !d.pjs) continue;
      try {
        var page = await d.pjs.getPage(pg.p + 1);
        var vp0 = page.getViewport({ scale: 1 });
        var rotation = (vp0.rotation + pg.rot) % 360;
        var vp = page.getViewport({ scale: 2, rotation: rotation });
        var cv = document.createElement('canvas');
        cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        imgs.push('<img src="' + cv.toDataURL('image/jpeg', 0.92) + '">');
      } catch (e) {}
    }
    if (!imgs.length) { toast('Rien à imprimer', 'error'); return; }
    var cadre = document.createElement('iframe');
    cadre.setAttribute('data-pdfcraft-impression', String(imgs.length));
    cadre.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    document.body.appendChild(cadre);
    var doc = cadre.contentDocument;
    doc.open();
    doc.write('<html><head><title>THEOLOGICUS — PDFCraft</title><style>' +
      '@page{margin:0} body{margin:0} img{display:block;width:100%;page-break-after:always}' +
      'img:last-child{page-break-after:auto}</style></head><body>' +
      imgs.join('') + '</body></html>');
    doc.close();
    try {
      document.dispatchEvent(new CustomEvent('pdfcraft-impression', { detail: { pages: imgs.length } }));
      window.__theoPdfcraftImpression = { pages: imgs.length };
      /* v607 — print() DIFFÉRÉ de 50 ms avec garde isConnected : les bancs
         retirent l'iframe sur l'événement (print() sur iframe détachée
         CRASHE le renderer headless — mesuré « Target crashed »). En
         production l'iframe reste 60 s et l'impression part normalement. */
      setTimeout(function () {
        try { if (cadre.isConnected) { cadre.contentWindow.focus(); cadre.contentWindow.print(); } } catch (e) {}
      }, 50);
    } catch (e) {}
    setTimeout(function () { try { cadre.remove(); } catch (e) {} }, 60000);
  }

  /* ── Formulaires : édition des champs (pdf-lib), enregistrement direct du
     document (les champs vivent au niveau du doc — l'assemblage par copyPages
     ne les conserve pas). Aplatir = les champs deviennent du texte figé. ── */
  function rendreFormulaires() {
    el.formulaires.textContent = '';
    var groupes = [];
    pc.docs.forEach(function (d, idx) {
      if (d.champs && d.champs.length) groupes.push({ d: d, idx: idx, champs: d.champs });
    });
    if (!groupes.length) { el.formulaires.style.display = 'none'; return; }
    el.formulaires.style.display = 'block';
    groupes.forEach(function (g) {
      var groupe = h('div', { 'class': 'pfc-form' });
      var tete = h('div', { 'class': 'pfc-form-tete' });
      tete.appendChild(h('span', { text: '📝 ' + g.d.name + ' — ' + g.champs.length + ' champ(s)' }));
      var aplatir = h('input', { type: 'checkbox', title: 'Aplatir (les champs deviennent du texte figé)',
        'aria-label': 'Aplatir le formulaire de ' + g.d.name });
      tete.appendChild(aplatir);
      var enreg = h('button', { 'class': 'pfc-btn', type: 'button', text: '💾',
        title: 'Enregistrer ce formulaire rempli' });
      enreg.addEventListener('click', function () { enregistrerFormulaire(g.idx, aplatir.checked); });
      tete.appendChild(enreg);
      groupe.appendChild(tete);
      g.champs.forEach(function (champ) {
        var nom = String(champ.getName() || '(sans nom)');
        /* 🔴 NE PAS utiliser champ.constructor.name : pdf-lib est MINIFIÉ, les
           noms de classes sont manglés. instanceof window.PDFLib est fiable. */
        var L = window.PDFLib;
        var estTexte = champ instanceof L.PDFTextField;
        var estCase = champ instanceof L.PDFCheckBox;
        var estListe = champ instanceof L.PDFDropdown || champ instanceof L.PDFRadioGroup ||
                       champ instanceof L.PDFOptionList;
        var ligne = h('div', { 'class': 'pfc-champ' });
        ligne.appendChild(h('span', { 'class': 'pfc-champ-nom', text: nom, title: nom }));
        if (estTexte) {
          var valeur = '';
          try { valeur = champ.getText() || ''; } catch (e) {}
          var inp = h('input', { type: 'text', value: valeur, 'aria-label': nom });
          inp.addEventListener('change', function () {
            try { champ.setText(inp.value); } catch (e) { toast('Champ refusé : ' + e.message, 'error'); }
          });
          ligne.appendChild(inp);
        } else if (estCase) {
          var cb = h('input', { type: 'checkbox', 'aria-label': nom });
          try { cb.checked = !!champ.isChecked(); } catch (e) {}
          cb.addEventListener('change', function () {
            try { cb.checked ? champ.check() : champ.uncheck(); }
            catch (e) { toast('Case refusée : ' + e.message, 'error'); }
          });
          ligne.appendChild(cb);
        } else if (estListe) {
          var sel = h('select', { 'aria-label': nom });
          var options = [];
          try { options = champ.getOptions() || []; } catch (e) {}
          options.forEach(function (o) { sel.appendChild(h('option', { value: o, text: o })); });
          try { var sel0 = champ.getSelected()[0]; if (sel0) sel.value = sel0; } catch (e) {}
          sel.addEventListener('change', function () {
            try { champ.select(sel.value); } catch (e) { toast('Choix refusé : ' + e.message, 'error'); }
          });
          ligne.appendChild(sel);
        } else {
          ligne.appendChild(h('span', { 'class': 'pfc-champ-nom', text: '(non éditable)' }));
        }
        groupe.appendChild(ligne);
      });
      el.formulaires.appendChild(groupe);
    });
  }
  async function enregistrerFormulaire(docIdx, aplatir) {
    var d = pc.docs[docIdx];
    if (!d) return;
    try {
      if (aplatir) {
        try { d.form.flatten(); }
        catch (e) { toast('Aplatissement impossible : ' + e.message, 'error'); return; }
      }
      var octets = await d.doc.save();
      enregistrerOctets(octets, 'PDFCraft-' + d.name + '-formulaire-' + horodatage() + '.pdf');
    } catch (e) { toast('Enregistrement impossible : ' + e.message, 'error'); }
  }

  /* ── Démarrage ── */
  function demarrer() {
    poserOnglet();
    poserPanneau();
    rendre();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
})();
</script>
