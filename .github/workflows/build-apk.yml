name: Build Android APK

# Construit THEOLOGICUS.apk (debug + release signe si le keystore est fourni).
#
# Secrets attendus (Settings > Secrets and variables > Actions) :
#   APK_KEYSTORE_B64   keystore JKS encode en base64  (optionnel)
#   APK_KEYSTORE_PASS  mot de passe du keystore       (optionnel)
#   APK_KEYSTORE_ALIAS alias de la cle                  (defaut : theologicus)
#
# Sans ces secrets, seule la variante debug est produite.

# Le filtre ci-dessous est un filtre d'ALLUMAGE, pas une liste d'exclusion :
# tout fichier absent de la liste ne declenche RIEN. C'est ainsi qu'on obtient un
# depot en 2.0.148 alors que la derniere release annonce encore 2.0.146 — deux
# commits qui ne touchaient que la memoire du projet n'ont produit aucun run,
# donc aucune release, donc l'application continuait de croire a 2.0.146.
# Consequence : un ecart silencieux entre le depot et ce que voit l'utilisateur.
# Le champ mis a jour le 2026-09-24 est donc DECLARE A LA FIN, pour qu'ajouter
# un fichier de l'application se voie du premier coup d'oeil.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'THEOLOGICUS.html'
      - 'ai-video.html'   # v126m : compagnon AI VIDEO — sans lui, un correctif du studio seul ne publiait jamais
      - 'newsreel.html'   # v498 : compagnon NewsReel (JT), ouvert depuis AI VIDEO — même piège que ci-dessus
      - 'theo_tests/**'   # v504 : tests unitaires du cœur — un test seul doit déclencher la CI
      - 'bible/**'
      - 'quran/**'
      - 'tafsir/**'
      - 'libs/**'
      - 'https/**'   # v573 certificat auto-signé du mode serveur HTTPS
      - 'android/**'
      - 'tools/**'
      - 'app.py'
      - 'installer.iss'
      - 'build_installer.bat'
      - 'THEOLOGICUS.ico'
      - 'VERSION'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
      # v489 — les BANCS sont bloquants (voir job `bancs`) : un correctif de
      # banc qui ne touche QUE le fichier de banc ne déclenchait AUCUN run
      # (le dépôt et la release divergeaient en silence — exactement le piège
      # décrit plus haut). On déclenche donc la CI sur les bancs eux-mêmes.
      - '.workbuddy-ai/artifacts/_v4*/verify_*.js'
      - '.workbuddy-ai/artifacts/_v5*/verify_*.js'   # v534 : _v5* inclus — un banc v5* seul ne declenchait RIEN ; _v1xx EXCLU (bancs Windows non portables)
      - '.workbuddy-ai/artifacts/_v6*/verify_*.js'   # v600 : chantier thèmes — un banc v6* seul doit déclencher la CI (même piège que v534)
      # --- ajoutez ici tout nouveau fichier dont depend l'application ---
      # La documentation et les journaux de memoire (.workbuddy-ai/** hors
      # bancs) restent volontairement DEHORS : un commit de notes ne doit pas
      # publier une version. Mais alors c'est le VERSION ci-dessus qui doit
      # bouger, sinon le depot et la release divergent en silence.

permissions:
  contents: write

jobs:
  # ── GARDE-FOUS (v462) ────────────────────────────────────────────────
  # Deux défauts RÉELS ont échappé aux builds parce que rien ne contrôlait :
  #  · la copie base64 d'ai-video.html embarquée dans THEOLOGICUS.html était
  #    périmée → l'APK servait une vieille page en repli (panne silencieuse) ;
  #  · les corpus biblelt (Vulgate) et syriaque (Peshitta) manquaient dans la
  #    liste des dossiers copiés → présents à l'écran, absents des binaires.
  # Ce job bloque désormais la publication si l'un des deux revient.
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cohérence (assets, copie embarquée, modules)
        run: python tools/verifier_assets.py
      # v504 — le CŒUR (parseur de références, normalisation) n'était couvert
      # que par des bancs Playwright bout-en-bout. Ces tests unitaires sont
      # rapides, déterministes, sans navigateur.
      - name: Tests unitaires du cœur
        run: node theo_tests/test_coeur.js

      # v599 — FUMÉE ultra-rapide (< 30 s, sans navigateur) : compte les modules
      # et vérifie les ancres critiques. Échoue AVANT de lancer la meute Playwright
      # coûteuse, donc remonte une régression grossière en < 2 min au lieu d'attendre
      # la fin du parcours des bancs.
      - name: Fumée structurale (retour < 2 min sur régression grossière)
        env:
          THEO_ROOT: ${{ github.workspace }}
        run: node tools/ci_smoke.js

  # ── BANCS (v462) ─────────────────────────────────────────────────────
  # Les vérifications vivaient uniquement sur la machine de développement :
  # une régression ne se voyait qu'à la main. Elles tournent maintenant ici.
  #
  # v599 — PARALLÉLISATION par SHARDS : autrefois tous les bancs couraient en
  # SÉQUENTIEL (une régression n'était signalée qu'à la FIN, > 40 min). On découpe
  # la liste en SHARD_TOTAL tranches, chacune dans un runner DIFFÉRENT et PARALLÈLE.
  # Un défaut remonte dès que SA tranche se termine (~ durée tranche / N).
  bancs:
    needs: controles
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false          # un shard en échec n'interrompt PAS les autres
      matrix:
        shard: [0, 1, 2, 3, 4]  # 5 tranches parallèles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg (banc d'assemblage)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Playwright + Chromium
        run: |
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Bancs (shard ${{ matrix.shard }})
        env:
          THEO_ROOT: ${{ github.workspace }}
          PY_BIN: python3
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 5
        run: node tools/bancs_shard.js

      # v604 — téléverse les rapports de shard : la porte bancs_gate tourne sur
      # un AUTRE runner et ne voyait jamais rapport_shard_*.md (le commentaire
      # de commit n'avait que l'en-tête, sans le détail des échecs).
      - name: Publier les rapports de shard (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: rapport_shard_*.md
          if-no-files-found: ignore
          retention-days: 3

  # v599 — PORTE AGREGÉE : les jobs build/windows attendent CETTE porte, pas les
  # shards individuels (sinon un shard vert masquerait un shard rouge). Elle n'échoue
  # que si AU MOINS UN shard a échoué, et publie le détail des échecs en commentaire
  # de commit (le journal de job n'étant lisible qu'avec un jeton).
  bancs_gate:
    needs: bancs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les rapports de shard
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: rapports-shard-*
          merge-multiple: true
          path: rapports
      - name: Agréger et publier le détail des échecs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "${{ needs.bancs.result }}" != "success" ]; then
            { echo "**Bancs : AU MOINS UN SHARD EN ÉCHEC.**"; echo; \
              for f in rapports/rapport_shard_*.md; do [ -f "$f" ] && { echo "──── $f"; cat "$f"; echo; }; done; } > rapport_final.md
            if [ -f rapport_final.md ]; then
              gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
                -f body="$(cat rapport_final.md)" > /dev/null && echo "détail publié"
            fi
            echo "Un ou plusieurs shards de bancs ont échoué — publication bloquée."
            exit 1
          fi
          echo "Tous les shards de bancs sont passés."

  # Les BANCS sont de nouveau bloquants (2026-10-08) : les deux échecs de la
  # première exécution étaient des défauts d'OUTILLAGE (chemin de navigateur en
  # dur dans v440, prérequis Ollama non déclaré dans v445), tous deux corrigés,
  # et le contrôle de portabilité empêche leur retour. Une régression réelle
  # doit désormais empêcher la publication. dépend de bancs_gate (agrégat des
  # shards parallèles) et non des shards individuels.
  build:
    needs: [controles, bancs_gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # profondeur complete : le versionCode vient de `git rev-list --count HEAD`
          fetch-depth: 0

      - name: Compute version from commit count
        run: |
          N=$(git rev-list --count HEAD)
          echo "VERSION_CODE=$N" >> "$GITHUB_ENV"
          echo "VERSION_NAME=4.0.$N" >> "$GITHUB_ENV"
          echo "Version : code=$N nom=4.0.$N"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK (runner preinstalled — unify paths, accept licenses)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null || true; fi
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets (mobile/www)
        env:
          APK_VERSION_NAME: '${{ env.VERSION_NAME }}'
        run: python3 tools/prepare_mobile.py

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode signing keystore (optional)
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
        run: |
          if [ -n "$APK_KEYSTORE_B64" ]; then
            echo "$APK_KEYSTORE_B64" | base64 -d > android/release.keystore
            echo "KEYSTORE_PRESENT=1" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=0" >> "$GITHUB_ENV"
            echo "Pas de keystore : la release sera non signee (APK debug produite)."
          fi

      - name: Build APKs
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
          APK_KEYSTORE_ALIAS: ${{ secrets.APK_KEYSTORE_ALIAS }}
          APK_VERSION_CODE: ${{ env.VERSION_CODE }}
          APK_VERSION_NAME: '${{ env.VERSION_NAME }}'
        run: |
          cd android
          chmod +x gradlew
          if [ "$KEYSTORE_PRESENT" = "1" ]; then
            ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: THEOLOGICUS-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Copy APKs to output/
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name '*.apk' -exec cp -v {} output/ \;
          ls -la output/

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.VERSION_NAME }}
          name: THEOLOGICUS v${{ env.VERSION_NAME }}
          files: output/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: [controles, bancs_gate]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version from commit count
        shell: bash
        run: |
          N=$(git rev-list --count HEAD)
          echo "VERSION_NAME=4.0.$N" >> "$GITHUB_ENV"
          echo "Version : nom=4.0.$N"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview pythonnet clr-loader

      - name: Build exe (PyInstaller)
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --name THEOLOGICUS
          --icon THEOLOGICUS.ico
          --hidden-import webview.platforms.winforms
          --hidden-import webview.platforms.edgechromium
          --hidden-import clr_loader
          --hidden-import pythonnet
          --collect-all webview --collect-all pythonnet --collect-all clr_loader
          app.py

      - name: Copy data files + version stamp
        shell: pwsh
        run: |
          Copy-Item THEOLOGICUS.html dist/THEOLOGICUS/
          # TOUS les corpus locaux, pas seulement bible/quran/tafsir : sans
          # eux les cinq onglets de bibliotheque et la Somme renvoient 404
          # dans l'exe, alors que l'APK les a.
          foreach ($d in 'bible','quran','tafsir','libs','summa','summafr','fathers','reformed','orthodox','islamic','denzinger','quranwbw','quranroots','biblehb','biblegr','latin','tradition','https') {
            if (Test-Path $d) {
              Copy-Item $d dist/THEOLOGICUS/ -Recurse -Force
            } else {
              Write-Error "corpus local manquant : $d"
              exit 1
            }
          }
          # v403 — le cache local de tradition n'est JAMAIS livre (comme build_installer.bat)
          if (Test-Path dist/THEOLOGICUS/tradition/cache) { Remove-Item -Recurse -Force dist/THEOLOGICUS/tradition/cache }
          Copy-Item THEOLOGICUS.ico dist/THEOLOGICUS/
          # v403 — service Supertonic local (bouton « Demarrer le service » des PARAMETRES).
          # Sans ces fichiers, l'exe de la CI repond « service absent ».
          New-Item -ItemType Directory -Force -Path dist/THEOLOGICUS/tools/supertonic | Out-Null
          Copy-Item tools/start_supertonic.py dist/THEOLOGICUS/tools/ -Force
          Copy-Item tools/supertonic/helper.py dist/THEOLOGICUS/tools/supertonic/ -Force
          Copy-Item tools/supertonic/LICENSE dist/THEOLOGICUS/tools/supertonic/ -Force
          Set-Content -Path dist/THEOLOGICUS/theologicus_keys.json -Value '{"mistral": ""}'
          $v = "$env:VERSION_NAME"
          python tools/stamp_version.py dist/THEOLOGICUS $v

      - name: Zip portable build into output/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Compress-Archive -Path dist/THEOLOGICUS -DestinationPath output/THEOLOGICUS-portable-win64.zip -Force

      - name: Build the Inno Setup installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'iscc' }
          & $iscc installer.iss "/DMyAppVersion=$env:VERSION_NAME"
          Copy-Item dist/THEOLOGICUS-Setup-x64.exe output/ -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: THEOLOGICUS-windows
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows build to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.VERSION_NAME }}
          name: THEOLOGICUS v${{ env.VERSION_NAME }}
          files: output/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
